name: Alpha release

on:
  push:
    tags:
      - "v*-alpha.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: genhoi-windows-x86_64.exe
            binary: target/release/genhoi.exe
          - os: ubuntu-latest
            asset: genhoi-linux-x86_64
            binary: target/release/genhoi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release --locked
      - name: Stage binary
        shell: bash
        run: cp "${{ matrix.binary }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub prerelease
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum genhoi-windows-x86_64.exe genhoi-linux-x86_64 > SHA256SUMS.txt
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/genhoi-windows-x86_64.exe
          dist/genhoi-linux-x86_64
          dist/SHA256SUMS.txt
          --prerelease
          --generate-notes
          --title "GenHOI ${GITHUB_REF_NAME}"
